name: Template - Scrypto Package CI - Build and Release

on:
  workflow_call:
    inputs:
      packages:
        required: true
        type: string   # Accept the JSON array of packages as a string
      scrypto_version:
        required: true
        type: string
      path:
        required: false
        type: string
        default: "."

jobs:
  scrypto-build-and-release:
    name: Build Blueprints
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/weftfinance/scrypto-builder:${{inputs.scrypto_version}}
      env:
        DOCKER_DEFAULT_PLATFORM: linux/amd64/v4
      
      volumes:
        - ${{github.workspace}}:/src

    steps:

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Restore dependencies from cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry/index/
            /usr/local/cargo/registry/cache/
            /src/**/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
     
      - name: Install jq
        run: apt-get update && apt-get install -y jq

      - name: Parse package array
        id: parse-packages
        run: |
          echo "Packages: ${{ inputs.packages }}"
          PACKAGES=$(echo '${{ inputs.packages }}' | jq -r '.[]')
          echo "::set-output name=package_array::${PACKAGES}"

      - name: Build Blueprints for each package
        run: |
          for package in ${{ steps.parse-packages.outputs.package_array }}; do
            echo "Building package: $package"
            scrypto build -p $package
          done

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./target/wasm32-unknown-unknown/release/*.wasm,./target/wasm32-unknown-unknown/release/*.rpd"
          tag: ${{ github.ref_name }}/${{ github.run_number }}
          name: "Package wasm release: ${{ github.ref_name }}) - ${{ github.run_number }}"
          prerelease: ${{ github.ref_name != 'main' }}
          