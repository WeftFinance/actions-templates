name: Template - Scrypto Package CI - Build and Release

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      scrypto_version:
        required: true
        type: string
    
jobs:
  scrypto-build-and-release:
    name: Build Blueprints
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/weftfinance/scrypto-builder:${{inputs.scrypto_version}}
      env:
        DOCKER_DEFAULT_PLATFORM: linux/amd64/v4
      
      volumes:
        - ${{github.workspace}}:/src

    steps:

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Restore dependencies from cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry/index/
            /usr/local/cargo/registry/cache/
            /src/**/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Blueprints
        run: scrypto build -p ${{ inputs.package }}
         
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./target/wasm32-unknown-unknown/release/{{ inputs.package }}.wasm,${{ inputs.package }}/target/wasm32-unknown-unknown/release/{{ inputs.package }}.rpd"
          tag: ${{ inputs.package }}/${{ github.ref_name }}/${{ github.run_number }}
          name: "Package release: ${{ inputs.package }} (${{ github.ref_name }}) - ${{ github.run_number }}"
          prerelease: ${{ github.ref_name != 'main' }}
